name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  node-syntax:
    name: Firebase scripts syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci --ignore-scripts
      - run: |
          for f in *.js; do
            echo "checking $f"
            node --check "$f"
          done

  projects-tests:
    name: Mini-projects (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: |
          for d in projects/day-*/; do
            if ls "$d"test_*.py >/dev/null 2>&1; then
              echo "=== testing $d ==="
              (cd "$d" && python -m pytest -q)
            fi
          done
